spring.application.name=lostandfound

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
# Choose ONE of the following database configurations:

# --- Option A: MySQL (Production) ---
# Uncomment the lines below and comment out the H2 section to use MySQL.
# Ensure that MySQL is running and the database 'lost_and_found_db' exists
# (or set createDatabaseIfNotExist=true to auto-create it).
# spring.datasource.url=jdbc:mysql://localhost:3306/lost_and_found_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# --- Option B: H2 In-Memory Database (Development / Default) ---
# Auto-creates tables on startup. Data is lost when the app stops.
spring.datasource.url=jdbc:h2:mem:lost_and_found_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================================================
# HIBERNATE / JPA CONFIGURATION
# =============================================================================
# 'update'  – auto-updates schema on startup (good for dev)
# 'validate'– validates schema but does not change it (good for prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# JWT CONFIGURATION
# =============================================================================
# Secret key (min 256-bit for HS256). Change this in production!
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token expiry: 86400000 ms = 24 hours
jwt.expiration=86400000

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging.level.org.springframework.security=INFO
logging.level.com.example.lostandfound=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
